# ==============================================================================
# Render Blueprint Specification
# Deploys Backend (Docker Web Service) & Frontend (Static Site with React Router)
# ==============================================================================

services:
  # 1. Java 17 Backend Web Service
  - type: web
    name: fullstack-blog-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 10000
      - key: ENVIRONMENT
        value: production
      - key: COOKIE_SECURE
        value: "true"
      # Set your cloud MySQL database details in the Render Dashboard:
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: FRONTEND_URL
        sync: false

  # 2. React 18 Frontend Static Site
  - type: web
    name: fullstack-blog-frontend
    runtime: static
    rootDir: ./frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    plan: free
    region: oregon
    routes:
      # React Router client-side rewrite rule
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Points to your deployed Render backend service
      - key: VITE_API_URL
        sync: false
